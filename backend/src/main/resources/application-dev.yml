spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/devdata

app:
  logging:
    chamados:
      texto-ficticio: ${CHAMADOS_LOG_TEXTO_FICTICIO:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    br.edu.impacta.resolveai.shared.logging.OperacoesChamadosLog: INFO
