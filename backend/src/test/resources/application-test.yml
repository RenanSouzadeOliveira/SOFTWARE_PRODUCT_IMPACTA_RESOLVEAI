spring:
  datasource:
    url: jdbc:h2:mem:resolveai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: chave-jwt-exclusiva-para-testes-com-mais-de-32-bytes
    expiration: PT2H
