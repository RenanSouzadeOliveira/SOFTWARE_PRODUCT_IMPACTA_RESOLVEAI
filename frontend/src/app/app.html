<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="ResolveAí, página inicial">
      <span class="brand__mark" aria-hidden="true">R</span>
      <span>ResolveAí</span>
    </a>

    <nav aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Início
      </a>
      @if (currentUser(); as user) {
        @if (user.perfil === 'SOLICITANTE') {
          <a routerLink="/chamados/novo" routerLinkActive="active">Abrir chamado</a>
        }
        @if (user.perfil === 'ATENDENTE') {
          <a routerLink="/atendimento" routerLinkActive="active">Atendimento</a>
        }
        <a routerLink="/minha-conta" routerLinkActive="active">Minha conta</a>
        <button type="button" class="nav-button" (click)="logout()">Sair</button>
      } @else {
        <a routerLink="/cadastro" routerLinkActive="active">Cadastre-se</a>
        <a routerLink="/login" routerLinkActive="active">Entrar</a>
      }
    </nav>
  </header>

  <main id="conteudo-principal" class="site-main">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <p>ResolveAí · Gestão de chamados</p>
  </footer>
</div>
